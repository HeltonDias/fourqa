name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: arquivos sensíveis
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.dump$|(^|/)\.vercel/'; then
            echo "arquivo sensível versionado"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: node --import tsx scripts/check-formulas-parity.mjs
      - run: npm run build

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run test:agents

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.100"
      - run: dotnet build backend/dotnet/FourQA.sln --configuration Release
      - run: dotnet test backend/dotnet/FourQA.sln --configuration Release --no-build --verbosity minimal

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test backend/dotnet/FourQA.sln --configuration Release --verbosity minimal
